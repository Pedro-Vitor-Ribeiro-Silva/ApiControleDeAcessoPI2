spring.application.name=ControleDeAcesso

# Porta HTTP: o Render informa a porta na variavel PORT; localmente usa 8080
server.port=${PORT:8080}

# Carrega variaveis locais do arquivo .env (nao versionado). Veja .env.example
spring.config.import=optional:file:.env[.properties]

# Cloudflare D1 (banco "projetointegrador")
cloudflare.d1.account-id=${CLOUDFLARE_ACCOUNT_ID:ba13ee9c7fe70785e1f33584181ae7f2}
cloudflare.d1.database-id=${CLOUDFLARE_D1_DATABASE_ID:1f5d228d-4a97-43aa-8b9f-87fd8c859f47}
cloudflare.d1.api-token=${CLOUDFLARE_API_TOKEN:}
# Executa um SELECT 1 na subida da aplicacao para validar a conexao
cloudflare.d1.verificar-conexao=true
